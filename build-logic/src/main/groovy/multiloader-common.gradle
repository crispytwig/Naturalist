plugins {
    id 'java-library'
}

group = mod_group_id
version = mod_version

base {
    archivesName = "${mod_id}-${mod_version}-${project.name}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version.toInteger()
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases/' }
    maven { url = 'https://maven.fabricmc.net/' }
    maven {
        name = 'Gegy'
        url = 'https://maven.gegy.dev/releases/'
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    compileOnly 'org.jetbrains:annotations:24.1.0'
    compileOnly 'org.jspecify:jspecify:1.0.0'
    compileOnly "dev.lambdaurora.lambdynamiclights:lambdynamiclights-api:${lambdynamiclights}"
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
ext.loaderAttribute = loaderAttribute
ext.applyLoaderAttribute = { String loader, List<String> variants, List<String> sourceSetTasks = [] ->
    variants.each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, loader)
            }
        }
    }
    sourceSets.configureEach { sourceSet ->
        ([sourceSet.compileClasspathConfigurationName, sourceSet.runtimeClasspathConfigurationName] + sourceSetTasks.collect { sourceSet.getTaskName(null, it) }).each { variant ->
            configurations.named(variant) {
                attributes {
                    attribute(loaderAttribute, loader)
                }
            }
        }
    }
}

tasks.withType(Jar).configureEach {
    archiveVersion = ''
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : mod_version,
                'Implementation-Title'  : project.name,
                'Implementation-Version': mod_version,
                'Implementation-Vendor' : mod_authors,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    var expandProps = [
            'version'                : mod_version,
            'mod_version'            : mod_version,
            'mod_id'                 : mod_id,
            'mod_name'               : mod_name,
            'mod_license'            : mod_license,
            'mod_description'        : mod_description,
            'mod_authors'            : mod_authors,
            'minecraft_version'      : minecraft_version,
            'minecraft_version_range': minecraft_version_range,
            'fabric_loader_version'  : fabric_loader_version,
            'fabric_api_version'     : fabric_api_version,
            'neo_version'            : neo_version,
            'loader_version_range'   : loader_version_range,
            'java_version'           : java_version
    ]

    filesMatching(['META-INF/neoforge.mods.toml', 'fabric.mod.json']) {
        expand expandProps
    }

    inputs.properties(expandProps)
}
