plugins {
    id 'multiloader-loader'
    id 'naturalist-publish'
    id 'net.fabricmc.fabric-loom-remap'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    modCompileOnly "maven.modrinth:field-guide:${field_guide_fabric}"
    modCompileOnly "dev.lambdaurora.lambdynamiclights:lambdynamiclights-api:${lambdynamiclights}"
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('run')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('run/server')
        }
    }
}

tasks.named('remapJar') { archiveVersion = '' }
tasks.named('remapSourcesJar') { archiveVersion = '' }

publishMods {
    file = remapJar.archiveFile
    version = "${mod_version}+${minecraft_version}-fabric"
    modLoaders.add('fabric')
    displayName = "${mod_name} ${mod_version} (Fabric ${minecraft_version})"
    curseforge { requires('fabric-api') }
    modrinth { requires('fabric-api') }
}

applyLoaderAttribute('fabric', ['apiElements', 'runtimeElements', 'sourcesElements', 'includeInternal', 'modCompileClasspath'])
