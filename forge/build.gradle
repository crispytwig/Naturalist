plugins {
    id 'multiloader-loader'
    id 'naturalist-publish'
    id 'net.neoforged.moddev.legacyforge'
}

mixin {
    add(sourceSets.main, "${mod_id}.refmap.json")
    config("${mod_id}.mixins.json")
    config("${mod_id}.fieldguide.mixins.json")
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"
    validateAccessTransformers = true
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers = [at.absolutePath]
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            ideName = "Forge ${it.name.capitalize()} (${project.path})"
        }
        client {
            client()
            gameDirectory = project.file('run')
        }
        server {
            server()
            gameDirectory = project.file('run/server')
        }
        data {
            data()
            gameDirectory = project.file('run/data')
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', rootProject.file('common/src/generated/resources').absolutePath,
                    '--existing', rootProject.file('common/src/main/resources').absolutePath
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    modCompileOnly "maven.modrinth:field-guide:${field_guide_forge}"
}

processResources {
    filesMatching(["${mod_id}.mixins.json".toString(), "${mod_id}.fieldguide.mixins.json".toString()]) {
        filter { String line -> line.replaceFirst(/^(\s*)"required"/, "\$1\"refmap\": \"${mod_id}.refmap.json\",\n\$1\"required\"".toString()) }
    }
}

jar {
    manifest.attributes([
            'MixinConfigs': "${mod_id}.mixins.json,${mod_id}.fieldguide.mixins.json"
    ])
}

publishMods {
    file = tasks.named('reobfJar').flatMap { it.archiveFile }
    version = "${mod_version}+${minecraft_version}-forge"
    modLoaders.add('forge')
    displayName = "${mod_name} ${mod_version} (Forge ${minecraft_version})"
}

applyLoaderAttribute('forge', ['apiElements', 'runtimeElements', 'sourcesElements'])
